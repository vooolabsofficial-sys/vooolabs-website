<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOOO LABS Template</title>
  <link rel="stylesheet" href="../../shared/brand.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 2048px;
      height: 2048px;
      overflow: hidden;
      background: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .canvas {
      width: 2048px;
      height: 2048px;
      position: relative;
      overflow: hidden;
      display: flex;
    }
    
  </style>
</head>
<body>
  <div class="canvas">
    
    <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
      <div style="width: 1400px; height: 1400px; border-radius: 360px; background: transparent; border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 40px 120px rgba(0,0,0,0.12);">
        <div style="display: flex; align-items: baseline; font-family: 'CrazyBlocks', sans-serif; font-size: 340px; line-height: 1; letter-spacing: 12px;">
          <span style="color: #000000;">V</span><span style="color: #000000;">O</span><span style="color: #000000;">O</span><span style="color: #000000;">O</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
